name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Dependency audit report
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulnerabilities = report.vulnerabilities || {};
          const summary = report.metadata?.vulnerabilities || {};
          console.log("Full dependency audit:", summary);
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === "object")
              .map((entry) => ({
                title: entry.title,
                severity: entry.severity,
                url: entry.url,
                range: entry.range,
              }));
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          NODE
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
