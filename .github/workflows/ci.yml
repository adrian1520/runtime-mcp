name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Dependency audit report
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulnerabilities = report.vulnerabilities || {};
          const summary = report.metadata?.vulnerabilities || {};
          console.log("Full dependency audit:", summary);
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === "object")
              .map((entry) => ({
                title: entry.title,
                severity: entry.severity,
                url: entry.url,
                range: entry.range,
              }));
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          NODE
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

  update-compatible-lockfile:
    name: Apply compatible dependency security fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'patch-001/security-workflow-hardening' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with compatible updates
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit the verified lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply compatible security updates"
          git push origin "HEAD:patch-001/security-workflow-hardening"
