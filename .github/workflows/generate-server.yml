name: Generate Server Registry

on:
  push:
    branches: [main, develop]
    paths:
      - "src/tools/**"
      - "scripts/update-server.ts"
      - "src/server.ts"
      - "package.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/tools/**"
      - "scripts/update-server.ts"
      - "src/server.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Verify generated server registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate server.ts
        run: npm run server:generate
      - name: Verify generated file is committed
        run: git diff --exit-code -- src/server.ts
