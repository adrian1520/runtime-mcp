name: Runtime MCP PDF Backend
run-name: runtime-mcp \${{ inputs.operation }} \${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: PDF backend operation.
        required: true
        type: choice
        options: [render, ocr, split, merge, metadata, image_to_pdf, pdf_to_images, searchable, rotate, crop]
      request_path:
        description: Repository path containing request JSON.
        required: true
        type: string
      request_id:
        description: Runtime MCP request id.
        required: true
        type: string
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      request_path:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  execute:
    name: Execute Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate request inputs
        shell: bash
        env:
          REQUEST_PATH: \${{ inputs.request_path }}
          REQUEST_ID: \${{ inputs.request_id }}
          OPERATION: \${{ inputs.operation }}
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || {
            echo "Invalid request_id" >&2
            exit 64
          }
          [[ "$REQUEST_PATH" =~ ^\.github/runtime-mcp/requests/[A-Za-z0-9._-]+\.json$ ]] || {
            echo "Invalid request_path" >&2
            exit 64
          }
          case "$OPERATION" in
            render|ocr|split|merge|metadata|image_to_pdf|pdf_to_images|searchable|rotate|crop) ;;
            *) echo "Invalid operation" >&2; exit 64 ;;
          esac
          [[ -f "$REQUEST_PATH" ]] || {
            echo "Request file not found" >&2
            exit 66
          }
      - name: Run PDF backend
        id: backend
        uses: ./.github/actions/pdf-backend
        with:
          operation: \${{ inputs.operation }}
          request_path: \${{ inputs.request_path }}
          workdir: runtime-work
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-mcp-\${{ inputs.request_id }}
          path: runtime-work/output
          if-no-files-found: error
          retention-days: 7
      - name: Generate workflow summary
        if: always()
        shell: bash
        env:
          REQUEST_ID: \${{ inputs.request_id }}
          OPERATION: \${{ inputs.operation }}
        run: |
          echo "## Runtime MCP PDF Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Request: $REQUEST_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operation: $OPERATION" >> "$GITHUB_STEP_SUMMARY"
          if [ -f runtime-work/output/execution.json ]; then
            cat runtime-work/output/execution.json >> "$GITHUB_STEP_SUMMARY"
          fi
