name: PDF to Markdown and PNG Converter

on:
  push:
    paths:
      - "pdf/**"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-converter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Create output directories
        run: |
          mkdir -p markdown png

      - name: Convert PDFs to Markdown and PNG
        shell: bash
        run: |
          shopt -s nullglob
          for pdf_file in pdf/*.pdf; do
            filename="$(basename "$pdf_file" .pdf)"
            echo "Extracting text from $filename..."
            pdftotext -layout "$pdf_file" "markdown/$filename.md"
            echo "Rendering pages from $filename..."
            pdftoppm -png -r 150 "$pdf_file" "png/$filename"
          done

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: pdf-converted-files
          path: |
            markdown/
            png/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          echo "## PDF conversion summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated outputs are available as the pdf-converted-files artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Markdown files: $(find markdown -maxdepth 1 -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "PNG pages: $(find png -maxdepth 1 -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
